name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, operator]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component }}/
          push: true
          # ghcr.io requires lowercase image paths; github.repository preserves
          # the repo's actual casing (K8s-Platform-Portal), so it is hardcoded
          # here in lowercase rather than interpolated.
          tags: |
            ghcr.io/ravishekharg/k8s-platform-portal/${{ matrix.component }}:${{ github.sha }}
            ghcr.io/ravishekharg/k8s-platform-portal/${{ matrix.component }}:latest