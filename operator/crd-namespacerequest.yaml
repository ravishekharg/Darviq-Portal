apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: namespacerequests.platform.company.io
spec:
  group: platform.company.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [teamName, environment, ownerEmail]
              properties:
                teamName:
                  type: string
                  pattern: '^[a-z0-9-]+$'
                environment:
                  type: string
                  enum: [dev, staging, prod]
                cpuLimit:
                  type: string
                  default: "2"
                memoryLimit:
                  type: string
                  default: "4Gi"
                ownerEmail:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  scope: Cluster
  names:
    plural:   namespacerequests
    singular: namespacerequest
    kind:     NamespaceRequest
    shortNames: [nsr]